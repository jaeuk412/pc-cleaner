name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: ruff check .

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
      - name: Smoke test with sample data
        run: |
          python tools/make_sample_data.py
          python main.py scan sample_data --report output/report.html
          python main.py clean sample_data --apply
          python main.py undo
          python main.py backup sample_data/work --dest output/backups --keep 3
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest' && matrix.python-version == '3.13'
        with:
          name: sample-report
          path: output/report.html
