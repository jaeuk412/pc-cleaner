[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"pccleaner/report.py" = ["E501"]  # HTML/CSS 템플릿 문자열
"docs/slides/build_pptx.py" = ["E501", "E741"]  # 슬라이드 좌표 정의 스크립트
